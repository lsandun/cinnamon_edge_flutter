# Leave room for Windows, Flutter, the IDE, and native Android build tools.
# The old 8G heap plus 4G metaspace limits could exhaust smaller build machines.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=false
# Avoid the incremental-cache registration failure observed in native plugins
# on Windows. Compile Kotlin fully inside the memory-limited Gradle process.
# Rebuilds may take longer, but do not reuse the failing incremental caches.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=true

# Flutter 3.47.7 uses the legacy AGP interfaces for Flutter/native plugins.
# Follow its official template until these plugins support the replacement interfaces.
android.newDsl=false
android.builtInKotlin=false
