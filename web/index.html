<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="cinnamon_edge">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Cinnamon Edge AI</title>
  <link rel="manifest" href="manifest.json">

  <!-- ONNX Runtime Web Script -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F7F9F6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    .app-icon {
      width: 68px;
      height: 68px;
      background: #1B4D3E;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(27, 77, 62, 0.22);
      margin-bottom: 20px;
      animation: pulse 1.6s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(0.96); opacity: 0.9; }
      100% { transform: scale(1.04); opacity: 1; }
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(27, 77, 62, 0.15);
      border-top: 3px solid #1B4D3E;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .app-title {
      font-size: 18px;
      font-weight: 700;
      color: #112211;
      margin-bottom: 4px;
    }
    .app-subtitle {
      font-size: 12.5px;
      color: #5D6D5F;
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <div class="app-icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.24-.26-.39-.61-.39-1.01 0-.83.67-1.5 1.5-1.5H16c3.31 0 6-2.69 6-6 0-4.97-4.03-9-10-9z"/>
      </svg>
    </div>
    <div class="spinner"></div>
    <div class="app-title">Cinnamon Edge AI</div>
    <div class="app-subtitle">Initializing Edge Engine...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
